apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sf-logout
  namespace: platforce
  labels:
    team: platforce
spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/isAlive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/isReady
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  envFrom:
    - secret: sf-logout
  filesFrom:
    - secret: sf-logout
  ingresses:
    - "https://communitylogout.ekstern.dev.nav.no"
    - "https://communitylogout.intern.dev.nav.no"
  accessPolicy:
    outbound:
      external:
        - host: test.salesforce.com
        - host: navdialog--sit2.my.salesforce.com
  env:
    - name: SF_TOKENHOST
      value: 'https://test.salesforce.com/services/oauth2/token'