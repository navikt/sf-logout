apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sf-logout
  namespace: teamcrm
  labels:
    team: teamcrm
spec:
  webproxy: true
  image: {{ image }}
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /isAlive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /isReady
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    enabled: true
    path: /metrics
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  envFrom:
    - secret: sf-logout
  filesFrom:
    - secret: sf-logout
  ingresses:
    - "https://communitylogout.ekstern.dev.nav.no"
    - "https://communitylogout.intern.dev.nav.no"
  accessPolicy:
    outbound:
      external:
        - host: test.salesforce.com
        - host: navdialog--sit2.my.salesforce.com
  env:
    - name: SF_TOKENHOST
      value: 'https://test.salesforce.com/services/oauth2/token'
    - name: SF_INSTANCE # TODO remove dependency to crm-utilites
      value: PREPROD
    - name: SF_VERSION
      value: 'v57.0'
    - name: VAULT_INSTANCE
      value: GCP