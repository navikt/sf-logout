plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jmailen.kotlinter' version '5.2.0'
    id 'com.gradleup.shadow' version '8.3.1'
}

group = 'no.nav.sf.logout'
version '0.2'

repositories {
    mavenCentral()
//    maven {
//        url "https://packages.confluent.io/maven"
//    }

//    ["maven-release"].each { repo ->
//        String token = System.getenv("GITHUB_TOKEN") ?: project.findProperty("githubPassword")
//        if (!token) throw new NullPointerException("Missing token, you have to set GITHUB_TOKEN or githubPassword")
//        maven {
//            url = uri("https://maven.pkg.github.com/navikt/$repo")
//            credentials {
//                username = 'x-access-token'
//                password = token
//            }
//        }
//    }
}

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.sf.logout.MainKt'
    }
}

shadowJar {
    archiveBaseName.set('app')
    archiveClassifier.set('')
}

application {
    mainClassName = 'no.nav.sf.logout.MainKt'
}

configurations {
    all*.exclude group: 'org.slf4j', module: 'slf4j-log4j12'
}

dependencies {
    implementation "no.nav.security:token-validation-core:5.0.29"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

    implementation "org.http4k:http4k-core:6.39.0.0"
    implementation "org.http4k:http4k-server-netty:6.39.0.0"
    implementation "org.http4k:http4k-client-okhttp:6.39.0.0"

    implementation 'com.google.code.gson:gson:2.13.2'

    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.5.32"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "tools.jackson.core:jackson-core:3.1.1" //Transitive for above

    implementation "io.prometheus:simpleclient_common:0.8.1"
    implementation "io.prometheus:simpleclient_hotspot:0.8.1"
}

test {
    useJUnitPlatform()
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    test.kotlin.srcDirs += 'src/test/kotlin'
}

kotlin {
    jvmToolchain(21)
}